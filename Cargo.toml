[package]
name = "g4ssg-core"
version = "0.1.0"
edition = "2024"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
license-file = "LICENSE"
maintenance = { status = "experimental" }

[lib]
path = "src/lib.rs"

[dependencies]
rand = "0.9.1"
dicebag = "0.3"
once_cell = "1.21.3"
log = "0.4"
env_logger = "0.11.8"
rayon = "1.10"
num-traits = "0.2.19"
paste = "1.0.15"
g4ssg-pm = { path = "../g4ssg-pm" }

[build-dependencies]
walkdir = "2.5.0"
syn = { version = "2.0.104", features = ["full"] }
