[package]
name = "g4ssg-core"
version = "0.1.1"
edition = "2024"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
license = "MIT OR Apache-2.0"

[badges]
maintenance = { status = "experimental" }

[lib]
path = "src/lib.rs"

[dependencies]
rand = "0.9.1"
dicebag = "0.3"
log = "0.4"
env_logger = "0.11.8"
paste = "1.0.15"
lazy_static = "1.5.0"
serde_jsonc = "1.0.108"
serde = { version = "1.0.228", features = ["derive"]}

[features]
default = []
local_test = []
popiii_candidate = []
