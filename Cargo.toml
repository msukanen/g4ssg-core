[package]
name = "g4ssg-core"
version = "0.1.3"
edition = "2024"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/msukanen/g4ssg-core.git"

[badges]
maintenance = { status = "experimental" }

[lib]
path = "src/lib.rs"

[dependencies]
dicebag = "0.3.29"
log = "0.4"
env_logger = "0.11.11"
paste = "1.0.15"
lazy_static = "1.5.0"
serde_jsonc = "1.0.108"
serde = { version = "1.0.228", features = ["derive"]}
astrometrics = "0.1.12-b"
mshc = { version = "0.1.4", features = ["derive"]}
either = "1.16.0"
rayon = "1.12.0"
bitflags = { version = "2.13.1", features = ["serde"]}

[features]
default = []
local_test = []
popiii_candidate = []
stresstest = []
abandon-all-hope = []
newtonist = []
f128-stable = ["dicebag/f128-stable", "astrometrics/f128-stable"]

[dev-dependencies]
num-format = "0.4.4"
